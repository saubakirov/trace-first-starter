task_id: TFW-56
title: "Review mode axis removal — external base rate, consumer audit, priming vs rows"

# Coordinator override: 1 instead of tfw.research.min_iterations = 2.
# Justification (owner-approved 2026-08-13): four of six hypotheses (H1, H2, H3, H4)
# are settled by measurement, not judgement — the AFD REVIEW corpus plus a consumer
# grep is a single Gather. H5 is answered by the same audit. Only H6 (priming vs rows)
# requires argument, and it is assigned to Challenge in this iteration. If Challenge
# cannot close H6, iteration 2 is warranted — added then, not assumed now.
min_iterations: 1
max_iterations: 3

iterations:
  - number: 1
    focus: >-
      Replicate the base-rate measurement outside this repository (AFD, ~149 REVIEW files on
      byte-identical review templates), audit every consumer of tfw.review.default_mode and the
      `Review Mode` header field, build the 8-mode-rows x 7-universal-rows coverage matrix, and
      attack H6 head-on: was the axis's value the checklist rows, or the priming of the reviewer
      that D28 and the "Naming Creates Behaviour" value both predict?
    hypotheses: [H1, H2, H3, H4, H5, H6]
    status: complete
    res_file: research/iter1/RES.md
    sources: [codebase, external_project]
    completed: 2026-08-13
    corpus: >-
      203 mode-carrying REVIEW files / 637 mode-specific rows across three TFW installs —
      ai-first-devices (149 REVIEWs, TFW 0.9.0), helpdesk (70, 0.8.7, added by owner at the
      briefing gate), this repository (61, 1.0.0). Drift-gated: AFD's review surface is
      byte-identical to 1.0.0; helpdesk's drift is Evidence-Layer only.
    outcome: >-
      H3 REFUTED — the HL's central empirical claim does not replicate. Mode rows fire at
      10.2% raw / 7.7% hard vs an 8.4% / 8.3% universal baseline; all eight rows fired.
      H1 refuted as stated, H2 partial, H4 split, H5 confirmed, H6 unresolved (no test
      available in the corpus). Six amendment proposals (A1-A6) target frozen §3/§5/§6 and
      require an owner verdict in HL §12 before any TS is written.
    result: H1 ❌ · H2 🟡 · H3 ❌ · H4 🟡 · H5 ✅ · H6 🔴
