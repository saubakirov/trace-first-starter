# cannot close H6, iteration 2 is warranted — added then, not assumed now.
min_iterations: 1
max_iterations: 3

iterations:
  - number: 1
    focus: >-
      Replicate the base-rate measurement outside this repository (AFD, ~149 REVIEW files on
      byte-identical review templates), audit every consumer of tfw.review.default_mode and the
      `Review Mode` header field, build the 8-mode-rows x 7-universal-rows coverage matrix, and
      attack H6 head-on: was the axis's value the checklist rows, or the priming of the reviewer
      that D28 and the "Naming Creates Behaviour" value both predict?
    hypotheses: [H1, H2, H3, H4, H5, H6]
    status: pending
    res_file: research/iter1/RES.md
