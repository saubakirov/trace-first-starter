task_id: TFW-53
title: >-
  HL as a frozen strategic contract with an amendment protocol, plus goal defence in review
  (north-star anchor + substantive Judge check + reviewer identity)

# From tfw.research.min_iterations. Not overridden.
min_iterations: 2
# Soft ceiling. Two iterations are planned; the third exists only as contingency.
max_iterations: 3

# The researcher runs in a separate Claude Code session with no history of the planning
# conversation. Everything needed is in the HL and in the per-iteration entries below.
# Required reading before Briefing:
#   - HL-TFW-53__hl_contract_and_goal_defence.md — the whole file. §2 carries the TFW-48/49
#     forensics, §3 carries the AFD evidence, §10 carries the hypotheses under test.
#   - The HL contract is FROZEN. §1, §3, §4, §5, §6, §7 may not be edited. Findings that
#     touch them are Amendment Proposals for HL §12, not updates. Free sections may be
#     updated directly. This rule is the subject of the task and applies to the task itself.

iterations:
  - number: 1
    focus: >-
      Contract calibration against TFW's own history. Three questions, all answerable from
      this repository without external research.
      (a) H1 — count and classify: read the `HL Update Recommendations` tables in every RES
      under tasks/TFW-32, TFW-38, TFW-41, TFW-42, TFW-46, TFW-47. Classify each row by the HL
      section it targets, against the frozen/free split in HL §3. The output is a number: what
      fraction of historical research output would have triggered an amendment escalation.
      If the frozen set produces frequent escalations, the split is wrong and HL §3 needs an
      Amendment Proposal.
      (b) H3 — decide the contract-state mechanism. A header field plus an append-only §12,
      or a filesystem-level marker as D31/F4 would suggest (structural enforcement beats format
      enforcement). Note the constraint discovered in TFW-48: its pre-amendment HL was never
      committed, so its drift is permanently unverifiable. Whatever mechanism is chosen must
      make the baseline diffable.
      (c) H6 — diff historical Phase HLs against their master HLs (TFW-32, TFW-41, TFW-42,
      TFW-46, TFW-47 all have phase folders). Did Phase HLs introduce deliverables absent from
      the master? If yes, the freeze must cover them or the drift simply relocates one level down.
      Also resolve two open design questions recorded in HL §10 Blind Spots: whether tightening
      a DoF and loosening a DoD need the same amendment path (freeze asymmetry), and how the
      amendment protocol composes with the existing REJECT branching in conventions.md §5.
    hypotheses: [H1, H3, H6]
    status: complete
    # Completed 2026-08-08, deep mode, autonomous run (owner-authorised, gates disabled).
    # Outcome: H1 refuted (76% of 213 historical rows target frozen sections; 35/36 iterations
    # would escalate). H3 partially confirmed (no new file needed; a header cannot name its own
    # baseline, so a git baseline reference is required). H6 confirmed and understated (TFW-48
    # phase HL is a full second contract; three master principles did not survive derivation).
    # Recommended configuration C4; 5 amendment proposals + 11 refinements handed to the coordinator.
    res_file: research/iter1/RES.md
    agent: claude-code (separate session, owner-launched)
    sources:
      - codebase
      - git-history

  - number: 2
    focus: >-
      Construct the goal-defence check. H2, H7, H8, H9, H10 are already settled — do not
      re-litigate them; see HL §10 for their status and evidence.
      (a) H12 — the owner's hypothesis, highest value in this iteration: the project north star
      is the root README.md, and no new artifact is needed. Test the corollary: PV Index
      priority 1 is labelled "README Values" and resolves to `.tfw/README.md` § Values — which is
      *methodology* values, byte-identical in every TFW project — while project purpose lives in
      the root README. Verify against a real project: AFD's root README has "## Проблема" /
      "## Цель" and no Values section. If confirmed, PV priority 1 is citing the wrong file in
      every TFW project and the index needs correcting, not just extending.
      (b) H13 — minimum viable north-star payload. AFD's anchor (HL-AFD-2) is 509 lines but only
      §1 Vision (~27 lines) and §7 Principles (~14 lines) are reviewer-relevant. Determine what a
      reviewer actually needs and whether the anchor can be optional for small projects.
      (c) H11 — the forcing function. Does requiring the reviewer to quote the north-star clause
      the work serves prevent rubber-stamping? Reference pattern: D43 Knowledge Citations, adopted
      for the same reason.
      (d) Verdict vocabulary — open owner question, deferred to research. Coin domain-agnostic
      English terms for the goal-failure verdict and its finding. AFD's working idioms are Russian
      and project-grown ("объявленная функция фазы не достигнута", "hotfix, not investment",
      "decoration vs delivery"); per D28/F29 terms from real usage outperform invented ones, but
      they cannot transfer verbatim. Also decide whether a goal-grounds rejection needs a verdict
      name distinct from REJECT — "built wrong" and "built the wrong thing" have different
      consequences and different routing.
      (e) Mandatory validation, HL DoD-23. Replay the drafted check against the seven TFW-48/49
      phase REVIEWs (recoverable via `git show 721ca15:<path>`) and against three TFW reviews that
      were genuinely sound. At least one non-approve on the former, none on the latter. A check
      that fires on everything is as useless as one that fires on nothing.
      (f) Open threads carried from iteration 1 — read `research/iter1/RES.md` first; its decisions
      D1-D14 constrain this iteration.
      (f1) The reference set for the goal check must be specified as **master HL frozen baseline +
      north star, explicitly excluding the phase HL and the TS**. Iteration 1 found an extra
      unapproved link in the principle chain: phase HLs author their own §7, so a Judge check
      reading the phase HL validates against a principle list written below the owner's approval.
      TFW-48 is the proof — master P7 did not survive into the phase HL its reviewers checked against.
      (f2) Negative control for the replay: TFW-48's approved master HL **already carried goal
      defence** — DoD-11 ("Review can reject work that satisfies TS/RF but violates the product
      north star") and P7 ("Independent Review Protects the North Star"). Both were lost. Ask
      whether the drafted check would have fired given that the master already demanded it. A check
      that would not have fired here is not a check.
      (f3) Salami residual: twelve individually defensible deliverable refinements can sum to a new
      phase and none reach §12. Cheap to test — does a `git diff` against the freeze baseline at the
      pre-TS gate cost anything?
      (f4) Verdict vocabulary must compose with the amendment protocol, not around it: iteration 1's
      D11 redefines REJECT branch (a) as "file an amendment". Any new verdict class must fit that.
    hypotheses: [H11, H12, H13]
    status: pending
    res_file: research/iter2/RES.md
    agent: claude-code (separate session, owner-launched)
    sources:
      - codebase
      - git-history
      - cross-project   # d:/projects/research/ai-first-devices (AFD)
      - external        # change-control and amendment protocols, for naming sanity-check only

