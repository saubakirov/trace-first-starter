# CANONICAL TEMPLATE — copy to the per-machine location below. NOT into the project tree.
#
#   POSIX     ~/.tfw/bindings.yaml
#   Windows   %LOCALAPPDATA%\tfw\bindings.yaml
#
# WHAT THIS FILE IS FOR, and its one job: when an immutable delegation mandate or explicit
# attribution requirement needs a stable principal, it says which declared principal THIS machine
# acts as. Ordinary owner-direct workflow activation does not require a binding or invent an agent
# principal. A binding grants nothing, proves nothing, and activates nothing.
#
# WHY IT LIVES OUTSIDE THE PROJECT. A project-local file can be gitignored but not
# sync-ignored, so under file synchronization a per-user file reaches every participant who
# shares the folder. This one is per-machine by construction, not by a rule someone remembers.
#
# WHEN YOU NEED IT. Read it only when stable attribution is required. If that attribution is
# required and absent or ambiguous, ask one short question before a durable write. Do not ask an
# identity question merely because `team/` contains multiple profiles.

bindings:
  # absolute path to the project root : the principal handle this machine acts as
  /abs/path/to/project: principal-handle
  C:\abs\path\to\other-project: other-principal

# ONE MAPPING PER PROJECT, and nothing else in the file. No preferences, no device
# identifiers, no tokens, no authority, no mentality, no fallback, no defaults, no liveness,
# and no provider data. If this file ever needs a second kind of key, that is a design change —
# stop and ask rather than inventing one here.
#
# A HANDLE MUST NAME A VALID PROFILE in that project's team/. An agent principal is valid only
# when its profile names an existing accountable human. Historical Boolean amendment fields are
# readable but never supply current authority.
# A binding pointing at a missing or invalid profile sends a session back to asking exactly one
# short identity question; correct the binding rather than recreating a deleted profile.
#
# A BINDING MAY SELECT A HUMAN OR AGENT PRINCIPAL. It never makes a provider, model, process,
# session, workflow role, or per-run profile into a principal. Do not create a profile merely
# to bind one run.
#
# IDENTITY IS NEVER INFERRED from an OS username, a hostname, a folder name or an account
# display string. A machine does not know who is sitting at it, and a guess becomes a durable
# attribution nobody made. This file exists so the answer is declared instead of guessed.
