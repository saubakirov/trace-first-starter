# TFW Project Configuration
# Fields marked ← PROJECT: set during init, preserved during update
# Fields marked ← FRAMEWORK: updated by tfw-update from upstream

project:                              # ← PROJECT: set during init
  name: my-project
  repo: user/my-project
  branch: main

tfw:
  version: "2.0.0"                    # ← FRAMEWORK: updated by tfw-update
  upstream: "https://github.com/saubakirov/trace-first-starter"  # ← FRAMEWORK
  # Where this payload ACTUALLY came from: <source>@<tag>. `upstream` is where updates
  # are fetched from by default, and the two differ — a local unpushed tag is
  # unreachable from a remote URL, so without this the next update clones the remote,
  # finds an older payload and reports that all is well. Written by update.md Step 7.
  installed_from: "unrecorded"        # ← PROJECT: set by each update
  content_language: en                # ← PROJECT: set during init

  # Ordered task containers. A task is CREATED in the first entry; a task is RESOLVED by
  # searching every entry in order. A new project needs exactly one. A project migrating
  # from a pre-2.0.0 layout lists its old container second so old paths keep resolving —
  # that is one setting with two values, not two supported layouts.
  task_containers: [tasks]            # ← PROJECT: set during init

  # Current identifier grammar. PREFIX and owner-approved ABBR are uppercase alphanumeric;
  # neither may contain `_`, so the separators are unambiguous. The stamp comes from the
  # system clock. Creation reads no counter and refuses an existing full identifier.
  id_format: "{PREFIX}_{YYYYMMDD}-{HHMMSS}_{ABBR}"  # ← FRAMEWORK
  legacy_id_format: "{prefix}-{seq}"  # ← FRAMEWORK: readable, never issued
  task_prefix: PROJ                   # ← PROJECT: current and legacy prefix

  journal:                            # ← FRAMEWORK
    max_summary_length: 120           # code points; raise only against a measurement

  scope_budgets:                      # ← PROJECT: managed by /tfw-config; preserve on update
    max_files_per_phase: 50
    max_new_files: 50
    max_loc: 5000
    max_modified_files: 50

  templates:                          # ← FRAMEWORK: updated by tfw-update
    hl: .tfw/templates/HL.md
    ts: .tfw/templates/TS.md
    res: .tfw/templates/RES.md
    rf: .tfw/templates/RF.md
    onb: .tfw/templates/ONB.md
    review: .tfw/templates/REVIEW.md
    knowledge: .tfw/templates/KNOWLEDGE.md
    release: .tfw/templates/RELEASE.md

  workflows:                          # ← FRAMEWORK: updated by tfw-update
    plan: .tfw/workflows/plan.md
    research: .tfw/workflows/research/base.md
    handoff: .tfw/workflows/handoff.md
    review: .tfw/workflows/review.md
    resume: .tfw/workflows/resume.md
    docs: .tfw/workflows/docs.md
    release: .tfw/workflows/release.md
    update: .tfw/workflows/update.md
    init: .tfw/workflows/init.md
    knowledge: .tfw/workflows/knowledge.md
    config: .tfw/workflows/config.md

  research:                           # ← FRAMEWORK: updated by tfw-update
    max_web_queries_per_stage: 5
    max_files_per_stage: 15
    max_questions_per_turn: 3
    max_passes: 3
    min_iterations: 2
    default_mode: focused
    modes:
      focused:
        loops_per_stage: 1
        verify_user_tech_claims: true
      deep:
        loops_per_stage: 3
        verify_user_tech_claims: true
        require_counter_evidence: true

  review:                             # ← FRAMEWORK: updated by tfw-update
    min_verify_ratio: 0.42

  knowledge:                          # ← FRAMEWORK: updated by tfw-update
    interval: 5
    gate_mode: hard
    max_index_lines: 200
    max_index_facts_lines: 30
    max_facts_per_topic: 50
    max_topic_files: 8

  statuses:                           # ← FRAMEWORK: updated by tfw-update
    - id: TODO
      emoji: "⬜"
      description: "Task registered, work not started"
    - id: HL_DRAFT
      emoji: "📝"
      description: "HL being drafted or discussed"
      role: coordinator
    - id: RES
      emoji: "🔬"
      description: "Research in progress (optional)"
      role: researcher
    - id: PHASES
      emoji: "🧩"
      description: "Phases are running; each phase carries its own state"
      role: coordinator
    - id: TS_DRAFT
      emoji: "🟡"
      description: "TS written, awaiting approval"
      role: coordinator
    - id: ONB
      emoji: "🟠"
      description: "Executor onboarding"
      role: executor
    - id: RF
      emoji: "🟢"
      description: "Execution complete, RF written"
      role: executor
    - id: REV
      emoji: "🔍"
      description: "Review in progress"
      role: reviewer
    - id: KNW
      emoji: "📚"
      description: "Knowledge capture (tfw-docs + tfw-knowledge)"
      role: coordinator
    - id: DONE
      emoji: "✅"
      description: "Task closed"
    - id: BLOCKED
      emoji: "❌"
      description: "Blocked by dependency"
    - id: REJECTED
      emoji: "❌"
      description: "Closed unsuccessfully, terminal, trace retained"

build:                                # ← PROJECT: set during init
  lint: echo "configure your lint command"
  test: echo "configure your test command"
  # A real command, not a placeholder: every TFW project ships this tool, so this one
  # works from the moment the payload lands. It checks each task's OWN state against the
  # closed schema, which is task-local and therefore never a shared write.
  verify: python .tfw/scripts/gen_index.py --check tasks
# Set lint and test to real commands during init. A placeholder means the executor's
# build gate in handoff.md verifies nothing.
#
# `build.*` is a PROJECT section: an update PRESERVES it and never overwrites it. So if a
# release relocates a tool, a command here keeps naming the old path — silently, forever.
# `gen_index.py --check project` reports exactly that, and the migration guide for a major
# release names this block as something the operator revisits by hand.
