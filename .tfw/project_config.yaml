project:
  name: my-project
  repo: user/my-project
  branch: main

tfw:
  version: "1.3.0"            # Installed TFW version (update via tfw-update)
  upstream: "https://github.com/saubakirov/trace-first-starter"  # Source for tfw-update
  content_language: en      # Language for filled artifact content (en, ru, etc.)

  # Ordered task containers. A task is CREATED in the first entry; a task is RESOLVED by
  # searching every entry in order. One concept, not two supported layouts.
  # This project lists two because the pre-2.0.0 corpus keeps its paths: renaming it would
  # have orphaned thousands of references and hundreds of commit subjects.
  task_containers: [workspace, tasks]

  # Identifier grammar. Clock-derived, so creating a task reads no counter and no other
  # task directory — two people offline from each other cannot collide.
  id_format: "{YYYYMMDD}-{HHMMSS}"
  id_max_retries: 5         # bounded retry when the clock re-offers a used value
  legacy_id_format: "{prefix}-{seq}"   # still readable everywhere; never issued again
  task_prefix: TFW          # legacy prefix only — retained so old IDs resolve

  journal:
    max_summary_length: 120 # code points; measured, see .tfw/templates/journal_event.md

  scope_budgets:
    max_files_per_phase: 30
    max_new_files: 15
    max_loc: 3000
    max_modified_files: 30

  templates:
    hl: .tfw/templates/HL.md
    ts: .tfw/templates/TS.md
    res: .tfw/templates/RES.md
    rf: .tfw/templates/RF.md
    onb: .tfw/templates/ONB.md
    review: .tfw/templates/REVIEW.md
    knowledge: .tfw/templates/KNOWLEDGE.md
    release: .tfw/templates/RELEASE.md

  workflows:
    plan: .tfw/workflows/plan.md
    research: .tfw/workflows/research/base.md
    handoff: .tfw/workflows/handoff.md
    review: .tfw/workflows/review.md
    resume: .tfw/workflows/resume.md
    docs: .tfw/workflows/docs.md
    release: .tfw/workflows/release.md
    update: .tfw/workflows/update.md
    init: .tfw/workflows/init.md
    knowledge: .tfw/workflows/knowledge.md
    config: .tfw/workflows/config.md

  research:
    max_web_queries_per_stage: 5
    max_files_per_stage: 15
    max_questions_per_turn: 3
    max_passes: 3
    min_iterations: 2           # Minimum research iterations before TS (coordinator gate)
    default_mode: focused
    modes:
      focused:
        loops_per_stage: 1
        verify_user_tech_claims: true
      deep:
        loops_per_stage: 3
        verify_user_tech_claims: true
        require_counter_evidence: true

  review:
    min_verify_ratio: 0.42    # minimum fraction of changed files to verify (escalate to 1.0 on discrepancy)

  knowledge:
    interval: 5
    gate_mode: hard          # hard / soft / off
    max_index_lines: 200
    max_index_facts_lines: 30
    max_facts_per_topic: 50
    max_topic_files: 8

  statuses:
    - id: TODO
      emoji: "⬜"
      description: "Task registered, work not started"
    - id: HL_DRAFT
      emoji: "📝"
      description: "HL being drafted or discussed"
      role: coordinator
    - id: RES
      emoji: "🔬"
      description: "Research in progress (optional)"
      role: researcher
    - id: TS_DRAFT
      emoji: "🟡"
      description: "TS written, awaiting approval"
      role: coordinator
    - id: ONB
      emoji: "🟠"
      description: "Executor onboarding"
      role: executor
    - id: RF
      emoji: "🟢"
      description: "Execution complete, RF written"
      role: executor
    - id: REV
      emoji: "🔍"
      description: "Review in progress"
      role: reviewer
    - id: KNW
      emoji: "📚"
      description: "Knowledge capture (tfw-docs + tfw-knowledge)"
      role: coordinator
    - id: DONE
      emoji: "✅"
      description: "Task closed"
    - id: BLOCKED
      emoji: "❌"
      description: "Blocked by dependency"
    - id: REJECTED
      emoji: "❌"
      description: "Closed unsuccessfully, terminal, trace retained"

build:
  lint: python -m pytest docs/scripts/ -q --collect-only
  test: python -m pytest docs/scripts/ -q
  verify: python docs/scripts/gen_index.py --check
